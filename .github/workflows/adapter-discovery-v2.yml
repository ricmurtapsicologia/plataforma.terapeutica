name: Adapter Discovery v2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/adapter-discovery-v2.mjs'
      - '.github/workflows/adapter-discovery-v2.yml'
  schedule:
    - cron: '31 6 * * *'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover form and identity contracts
        shell: bash
        run: |
          set -o pipefail
          node tests/adapter-discovery-v2.mjs | tee adapter-discovery-v2.json
      - name: Upload discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adapter-discovery-v2
          path: adapter-discovery-v2.json
          retention-days: 14
