name: Codependência — Pipeline v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rastreios/pipeline/apps-script/CodependenciaProvisioner.gs'
      - 'rastreios/pipeline/apps-script/CodependenciaWebApp.gs'
      - 'rastreios/pipeline/apps-script/Code.gs'
      - 'tests/codependencia-pipeline-v1.test.mjs'
      - '.github/workflows/codependencia-pipeline-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Codependencia pipeline contract
        run: node tests/codependencia-pipeline-v1.test.mjs
