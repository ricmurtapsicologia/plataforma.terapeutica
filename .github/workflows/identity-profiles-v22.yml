name: Identity Profiles v2.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rastreios/pipeline/screening-adapters-v2.json'
      - 'assets/js/screening-system-v2.js'
      - 'rastreios/pipeline/apps-script/Code.gs'
      - 'tests/identity-profiles-v22.test.mjs'
      - '.github/workflows/identity-profiles-v22.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate identity profiles
        run: node tests/identity-profiles-v22.test.mjs
      - name: Revalidate explicit adapters
        run: node tests/screening-adapters-v2.test.mjs
