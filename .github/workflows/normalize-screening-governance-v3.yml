name: Normalize screening governance v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-screening-governance-v3.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Normalize canonical states
        run: |
          python3 - <<'PY'
          import csv
          import io
          import json
          from pathlib import Path

          manifest_path = Path('rastreios/pipeline/instruments.manifest.json')
          experience_path = Path('rastreios/pipeline/public-experience-v2.json')
          seed_path = Path('rastreios/pipeline/RastreiosConfig.seed.tsv')
          test_path = Path('tests/screenings-pipeline-v410.test.mjs')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          by_id = {item['id']: item for item in manifest['instruments']}

          by_id['necessidades']['contractState'] = 'SANITIZED_REVALIDATION_REQUIRED'
          by_id['codependencia']['contractState'] = 'GATEWAY_READY_GOOGLE_UPSTREAM_REQUIRED'
          by_id['codependencia']['collectorContract']['deploymentState'] = 'GATEWAY_READY_GOOGLE_UPSTREAM_REQUIRED'
          by_id['icaps']['contractState'] = 'BACKEND_ROUTE_INTEGRATED_UPSTREAM_REQUIRED'

          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          experience = json.loads(experience_path.read_text(encoding='utf-8'))
          experience['instruments']['icaps']['collectorReady'] = False
          experience['instruments']['icaps']['scorerValidated'] = False
          experience_path.write_text(json.dumps(experience, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Keep the seed aligned with the canonical manifest instead of maintaining
          # a second set of patient-facing names and versions by hand.
          rows = list(csv.DictReader(io.StringIO(seed_path.read_text(encoding='utf-8')), delimiter='\t'))
          monitoring = {'humor', 'ansiedade', 'autoestima'}
          for row in rows:
              item = by_id[row['instrument_id']]
              row['version'] = item['instrumentVersion']
              row['public_name'] = item['publicName']
              row['technical_name'] = item['technicalName']
              row['active'] = 'TRUE' if row['instrument_id'] in monitoring else 'FALSE'
              if row['instrument_id'] == 'impulsividade':
                  row['scorer'] = 'blocked_scoring_defect'
              elif row['instrument_id'] == 'icaps':
                  row['scorer'] = 'descriptive_non_psychometric'
              elif row['instrument_id'] in monitoring or row['instrument_id'] == 'codependencia':
                  row['scorer'] = 'raw_only'
              else:
                  row['scorer'] = 'pending'
          out = io.StringIO()
          writer = csv.DictWriter(out, fieldnames=['response_sheet','instrument_id','version','public_name','technical_name','scorer','active','safety_flow'], delimiter='\t', lineterminator='\n')
          writer.writeheader()
          writer.writerows(rows)
          seed_path.write_text(out.getvalue(), encoding='utf-8')

          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              "assert.equal(icaps?.contractState,'BACKEND_ROUTE_MISSING','ICAPS backend blocker must remain explicit until repaired');",
              "assert.equal(icaps?.contractState,'BACKEND_ROUTE_INTEGRATED_UPSTREAM_REQUIRED','ICAPS must remain blocked until the persistent upstream is configured and certified');"
          )
          test = test.replace(
              "assert.equal(needs?.contractState,'BROWSER_STORAGE_AND_FIRESTORE_BLOCKER','needs-screening privacy blocker must remain traceable until source sanitization is recertified');",
              "assert.equal(needs?.contractState,'SANITIZED_REVALIDATION_REQUIRED','needs-screening source sanitization must remain traceable until recertified');"
          )
          test = test.replace(
              "assert.equal(seedRows.filter(row=>row[5]==='pending'&&row[6]==='FALSE').length,12,'all pending scorers must remain inactive');",
              "assert.equal(seedRows.filter(row=>row[6]==='FALSE').length,12,'all twelve non-monitoring instruments must remain inactive');"
          )
          marker = "assert.equal(experience.designSystem,'RM Clinical Screening System v2','v2 design system reference missing');\n"
          addition = (
              "const codependencia=manifest.instruments.find(x=>x.id==='codependencia');\n"
              "assert.equal(codependencia?.contractState,'GATEWAY_READY_GOOGLE_UPSTREAM_REQUIRED','Codependência must remain blocked until Google upstream provisioning and receipt certification');\n"
              "assert.equal(experience.instruments.icaps?.collectorReady,false,'ICAPS collector must remain unavailable until the upstream persistence path is ready');\n"
              "assert.equal(experience.instruments.icaps?.scorerValidated,false,'ICAPS descriptive scoring must not be labeled psychometrically validated');\n"
          )
          if addition not in test:
              test = test.replace(marker, marker + addition)

          seed_marker = "const riskSeed=seedRows.find(row=>row[1]==='risco');\n"
          seed_addition = (
              "const impulseSeed=seedRows.find(row=>row[1]==='impulsividade');\n"
              "assert.equal(impulseSeed?.[5],'blocked_scoring_defect','impulsivity seed must preserve the confirmed scoring blocker');\n"
              "const icapsSeed=seedRows.find(row=>row[1]==='icaps');\n"
              "assert.equal(icapsSeed?.[2],'2.0.0','ICAPS seed must use the instrument version, not the scoring version');\n"
              "assert.equal(icapsSeed?.[5],'descriptive_non_psychometric','ICAPS seed must preserve descriptive non-psychometric scoring status');\n"
          )
          if seed_addition not in test:
              test = test.replace(seed_marker, seed_addition + seed_marker)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Validate canonical pipeline
        run: node tests/screenings-pipeline-v410.test.mjs

      - name: Commit normalized state
        run: |
          if git diff --quiet -- rastreios/pipeline/instruments.manifest.json rastreios/pipeline/public-experience-v2.json rastreios/pipeline/RastreiosConfig.seed.tsv tests/screenings-pipeline-v410.test.mjs; then
            echo 'No normalization needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rastreios/pipeline/instruments.manifest.json rastreios/pipeline/public-experience-v2.json rastreios/pipeline/RastreiosConfig.seed.tsv tests/screenings-pipeline-v410.test.mjs
          git commit -m 'Normaliza governança clínica dos rastreios'
          git push
