name: Public Surface Audit v2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/public-surface-audit-v2.mjs'
      - '.github/workflows/public-surface-audit-v2.yml'
      - 'assets/js/screening-system-v2.js'
      - 'assets/css/screening-system-v2.css'
      - 'rastreios/pipeline/**'
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan patient-facing repositories
        shell: bash
        run: |
          set -o pipefail
          node tests/public-surface-audit-v2.mjs | tee public-surface-audit.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-surface-audit-v2
          path: public-surface-audit.json
          retention-days: 14
