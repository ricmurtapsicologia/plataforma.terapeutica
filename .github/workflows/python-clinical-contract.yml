name: Python clinical sidecar contract

on:
  pull_request:
    paths:
      - 'services/python-clinical/**'
      - '.github/workflows/python-clinical-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/python-clinical
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated service dependencies
        run: pip install -r requirements.txt
      - name: Compile service
        run: python -m compileall -q app tests
      - name: Run contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
