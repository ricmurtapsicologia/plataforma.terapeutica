name: Screening Adapters v2

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
  push:
    branches: [main]
    paths:
      - 'rastreios/pipeline/screening-adapters-v2.json'
      - 'assets/js/screening-system-v2.js'
      - 'assets/js/screening-uniformity-v1.js'
      - 'tests/screening-adapters-v2.test.mjs'
      - '.github/workflows/screening-adapters-v2.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate explicit adapters against live source
        shell: bash
        run: |
          set -o pipefail
          node tests/screening-adapters-v2.test.mjs | tee screening-adapters-v2-report.json
      - name: Upload adapter validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screening-adapters-v2-report
          path: screening-adapters-v2-report.json
          retention-days: 14
