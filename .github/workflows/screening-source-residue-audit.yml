name: Screening source residue audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_screening_source_residues.py'
      - '.github/workflows/screening-source-residue-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan public screening sources
        run: python3 scripts/audit_screening_source_residues.py
      - name: Validate report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('rastreios/pipeline/source-residue-audit.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert len(d['instruments']) == 13
          assert all(v['cloneState'] == 'OK' for v in d['instruments'].values())
          assert len(d['rankedByStaticMarkerScore']) == 13
          PY
      - name: Commit audit snapshot
        run: |
          if test -z "$(git status --porcelain -- rastreios/pipeline/source-residue-audit.json)"; then
            echo 'No audit changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rastreios/pipeline/source-residue-audit.json
          git commit -m 'Atualiza inventário automático de resíduos dos rastreios'
          git push
