name: Screenings E2E Live v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/screenings-e2e-live-v1.mjs'
      - '.github/workflows/screenings-e2e-live-v1.yml'
      - 'assets/js/screening-system-v2.js'
      - 'assets/css/screening-system-v2.css'
      - 'rastreios/pipeline/**'
  schedule:
    - cron: '37 6 * * *'

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published runtime 2.2.1
        shell: bash
        run: |
          set -euo pipefail
          runtime_url="https://ricmurtapsicologia.github.io/plataforma.terapeutica/assets/js/screening-system-v2.js"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --no-cache "$runtime_url?cert=${GITHUB_SHA}-${attempt}" -o /tmp/screening-system-v2.js && grep -Fq "const VERSION='2.2.1';" /tmp/screening-system-v2.js; then
              echo "Published runtime 2.2.1 confirmed."
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Published runtime is not 2.2.1 after retries." >&2
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run live browser matrix
        shell: bash
        run: |
          set -o pipefail
          node tests/screenings-e2e-live-v1.mjs | tee screenings-e2e-live-v1.json
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenings-e2e-live-v1
          path: screenings-e2e-live-v1.json
          retention-days: 14
