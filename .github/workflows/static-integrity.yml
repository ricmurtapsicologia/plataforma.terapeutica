name: Static integrity

on:
  push:
    branches:
      - main
      - release/clinica-hardening-2026-09
    paths:
      - 'index.html'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'tests/**'
      - 'security/**'
      - '.github/workflows/static-integrity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'tests/**'
      - 'security/**'
      - '.github/workflows/static-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find assets/js tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Run every JavaScript regression test
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file; do
            echo "===== $file ====="
            node "$file"
            count=$((count+1))
          done < <(find tests assets/js -type f -name '*.test.mjs' | sort)
          test "$count" -gt 0
          echo "Executed $count JavaScript regression tests."

      - name: Deep static and public repository guards
        shell: bash
        run: |
          set -euo pipefail
          node tests/platform-deep-audit-v390.mjs
          python security/public_repo_guard.py .

      - name: Run real browser clinical probes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rm-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$candidate"; break; fi
          done
          if [ -z "$browser" ]; then echo 'Nenhum Chromium disponível no runner.'; exit 1; fi

          profile="/tmp/rm-browser-$RANDOM"
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=8000 --user-data-dir="$profile" --dump-dom http://127.0.0.1:8765/tests/browser-persistence-v271.html >/tmp/rm-persistence.html 2>/tmp/rm-browser.log || true
          grep -q '<pre id="result" data-e2e="ok">P0_BROWSER_PERSISTENCE_PASS</pre>' /tmp/rm-persistence.html || { cat /tmp/rm-browser.log || true; exit 1; }

          agenda_profile="/tmp/rm-agenda-browser-$RANDOM"
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --user-data-dir="$agenda_profile" --dump-dom http://127.0.0.1:8765/tests/agenda-browser-v330.html >/tmp/rm-agenda.html 2>/tmp/rm-agenda-browser.log || true
          grep -q '<pre id="result" data-e2e="ok">AGENDA_V330_BROWSER_PASS</pre>' /tmp/rm-agenda.html || { cat /tmp/rm-agenda-browser.log || true; exit 1; }

          record_profile="/tmp/rm-record-browser-$RANDOM"
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --user-data-dir="$record_profile" --dump-dom http://127.0.0.1:8765/tests/record-session-isolation-v400.html >/tmp/rm-record-isolation.html 2>/tmp/rm-record-isolation.log || true
          grep -q '<pre id="result" data-e2e="ok">RECORD_SESSION_ISOLATION_PASS</pre>' /tmp/rm-record-isolation.html || { cat /tmp/rm-record-isolation.log || true; exit 1; }

      - name: Check local import targets
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const files=[];
          function walk(dir){for(const name of fs.readdirSync(dir)){const p=path.join(dir,name),st=fs.statSync(p);if(st.isDirectory())walk(p);else if(/\.m?js$/.test(p))files.push(p)}}
          walk('assets/js');
          const missing=[];
          for(const file of files){
            const src=fs.readFileSync(file,'utf8');
            const re=/(?:from\s*|import\s*\()\s*['"](\.\.?\/[^'"]+)['"]/g;
            for(const m of src.matchAll(re)){
              const spec=m[1].split('?')[0].split('#')[0];
              const target=path.normalize(path.resolve(path.dirname(file),spec));
              if(!fs.existsSync(target))missing.push(`${file} -> ${m[1]}`);
            }
          }
          if(missing.length){console.error('Missing local imports:\n'+missing.join('\n'));process.exit(1)}
          console.log(`Validated local imports in ${files.length} JavaScript modules.`);
          NODE

      - name: Check release version and entrypoint consistency
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const version=fs.readFileSync('assets/js/version.js','utf8').match(/APP_VERSION='([^']+)'/)?.[1];
          if(!version)throw new Error('APP_VERSION not found');
          const index=fs.readFileSync('index.html','utf8');
          const main=fs.readFileSync('assets/js/main-v250.js','utf8');
          if(!index.includes(`content="${version}-main-v250"`))throw new Error(`index build marker does not match ${version}`);
          if(!index.includes(`main-v250.js?v=${version}`))throw new Error(`index entrypoint does not reference v=${version}`);
          if(!main.includes(`__rmEntrypointVersion='${version}-main-v250'`))throw new Error(`entrypoint marker does not match ${version}`);
          console.log(`Application version validated: ${version}`);
          NODE
