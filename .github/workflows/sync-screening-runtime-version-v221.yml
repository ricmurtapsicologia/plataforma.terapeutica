name: Sync Screening Runtime v2.2.1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-screening-runtime-version-v221.py'
      - '.github/workflows/sync-screening-runtime-version-v221.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize runtime, loader and guard versions
        run: python scripts/sync-screening-runtime-version-v221.py
      - name: Commit protected version sync
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/screening-system-v2.js assets/js/screening-uniformity-v1.js scripts/harden-legacy-results-hide-v1.py
          git commit -m "Sincroniza runtime público de rastreios em 2.2.1"
          git push
