name: UI stability quality

on:
  push:
    branches:
      - main
      - release/clinica-hardening-2026-09
    paths:
      - 'index.html'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'tests/**'
      - '.github/workflows/ui-stability-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static UI stability contract
        run: node tests/ui-stability-v380.test.mjs

      - name: Start local server and resolve Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rm-ui-http.log 2>&1 &
          echo $! >/tmp/rm-ui-http.pid
          sleep 1
          curl -fsS http://127.0.0.1:8765/index.html >/tmp/rm-index.html
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$(command -v "$candidate")"; break; fi
          done
          test -n "$browser" || { echo 'Nenhum Chromium disponível no runner.'; exit 1; }
          echo "CHROME_PATH=$browser" >> "$GITHUB_ENV"
          echo "BROWSER=$browser" >> "$GITHUB_ENV"
          npm install --no-save --no-package-lock puppeteer-core@24 >/tmp/puppeteer-ui-install.log 2>&1

      - name: Canonical smoke and clinical E2E
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_BASE_URL=http://127.0.0.1:8765 node tests/platform-browser-e2e-v391.mjs | tee /tmp/rm-ui-browser-e2e.log

      - name: Lighthouse mobile
        shell: bash
        run: |
          set -euo pipefail
          npx --yes lighthouse@12.8.2 http://127.0.0.1:8765/index.html \
            --chrome-path="$CHROME_PATH" \
            --chrome-flags="--headless --no-sandbox --disable-gpu --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output=html --output-path=/tmp/rm-lighthouse-mobile --quiet

      - name: Lighthouse desktop
        shell: bash
        run: |
          set -euo pipefail
          npx --yes lighthouse@12.8.2 http://127.0.0.1:8765/index.html \
            --preset=desktop \
            --chrome-path="$CHROME_PATH" \
            --chrome-flags="--headless --no-sandbox --disable-gpu --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output=html --output-path=/tmp/rm-lighthouse-desktop --quiet

      - name: Enforce Lighthouse floors and Web Vitals
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          function numericAudit(r,id){
            const value=r.audits?.[id]?.numericValue;
            return Number.isFinite(Number(value))?Number(value):Infinity;
          }
          function load(prefix){
            const path=[`${prefix}.report.json`,`${prefix}.json`].find(fs.existsSync);
            if(!path)throw new Error(`Lighthouse report missing: ${prefix}`);
            const r=JSON.parse(fs.readFileSync(path,'utf8'));
            const score=id=>Math.round(Number(r.categories?.[id]?.score??0)*100);
            return {
              scores:{performance:score('performance'),accessibility:score('accessibility'),bestPractices:score('best-practices'),seo:score('seo')},
              lcp:numericAudit(r,'largest-contentful-paint'),
              cls:numericAudit(r,'cumulative-layout-shift'),
              tbt:numericAudit(r,'total-blocking-time')
            };
          }
          const report={mobile:load('/tmp/rm-lighthouse-mobile'),desktop:load('/tmp/rm-lighthouse-desktop')};
          console.log('LIGHTHOUSE_QUALITY',JSON.stringify(report));
          const failures=[];
          for(const mode of ['mobile','desktop']){
            const s=report[mode].scores;
            if(s.performance<90)failures.push(`${mode}:performance=${s.performance}`);
            if(s.accessibility<95)failures.push(`${mode}:accessibility=${s.accessibility}`);
            if(s.bestPractices<95)failures.push(`${mode}:bestPractices=${s.bestPractices}`);
            if(s.seo<100)failures.push(`${mode}:seo=${s.seo}`);
            if(report[mode].cls>0.05)failures.push(`${mode}:cls=${report[mode].cls}`);
            if(report[mode].tbt>100)failures.push(`${mode}:tbt=${report[mode].tbt}`);
          }
          if(report.mobile.lcp>3000)failures.push(`mobile:lcp=${report.mobile.lcp}`);
          if(failures.length){console.error('UI_QUALITY_GATE_FAIL',failures.join(', '));process.exit(1)}
          console.log('UI_QUALITY_GATE_PASS');
          NODE

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-stability-quality
          path: |
            /tmp/rm-ui-browser-e2e.log
            /tmp/deep-browser-e2e.json
            /tmp/rm-lighthouse-mobile.report.json
            /tmp/rm-lighthouse-mobile.report.html
            /tmp/rm-lighthouse-desktop.report.json
            /tmp/rm-lighthouse-desktop.report.html
            /tmp/rm-ui-http.log
          if-no-files-found: ignore
