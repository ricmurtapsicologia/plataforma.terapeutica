<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Record session isolation v4</title></head>
<body>
<select id="record-session">
  <option value="p1-old">31/08/2026 · 19:00</option>
  <option value="p1-target">21/09/2026 · 19:00</option>
  <option value="p2-session">22/09/2026 · 18:00</option>
</select>
<input id="record-title" value="Evolução de sessão">
<input id="record-date" type="date">
<input id="record-time" type="time">
<textarea id="record-text"></textarea>
<textarea id="record-followup"></textarea>
<div id="record-save-status"></div>
<div id="toast-region"></div>
<pre id="result" data-e2e="running">RUNNING</pre>
<script type="module">
const result=document.getElementById('result');
const fail=message=>{result.dataset.e2e='fail';result.textContent=`RECORD_SESSION_ISOLATION_FAIL: ${message}`;throw new Error(message)};
const assert=(condition,message)=>{if(!condition)fail(message)};
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
window.confirm=()=>true;
try{
  const state=await import('../assets/js/state.js');
  const db=await import('../assets/js/database.js');
  try{await db.deleteDatabase()}catch{}
  const {key}=await db.createVault(`record-isolation-${Date.now()}`);
  state.runtime.key=key;
  state.runtime.locked=false;
  state.runtime.dataReady=true;
  state.runtime.route='patients';
  state.runtime.patientTab='records';
  state.runtime.selectedPatientId='p1';

  const p1={id:'p1',name:'Paciente Um',status:'Ativo',updatedAt:new Date().toISOString()};
  const p2={id:'p2',name:'Paciente Dois',status:'Ativo',updatedAt:new Date().toISOString()};
  const aOld={id:'a-old',clinicalSessionId:'p1-old',patientId:'p1',date:'2026-08-31',time:'19:00',status:'Realizada',updatedAt:new Date().toISOString()};
  const aTarget={id:'a-target',clinicalSessionId:'p1-target',patientId:'p1',date:'2026-09-21',time:'19:00',status:'Realizada',updatedAt:new Date().toISOString()};
  const aP2={id:'a-p2',clinicalSessionId:'p2-session',patientId:'p2',date:'2026-09-22',time:'18:00',status:'Realizada',updatedAt:new Date().toISOString()};
  const oldRecord={id:'record-old',patientId:'p1',appointmentId:'a-old',clinicalSessionId:'p1-old',date:'2026-08-31',time:'19:00',title:'Evolução de sessão',text:'Registro histórico original e imutável.',followup:'',sessionSummary:'LEGACY SUMMARY MUST NOT BECOME FOLLOWUP',status:'Finalizado',requiresReview:false,createdAt:'2026-08-31T22:00:00.000Z',updatedAt:'2026-08-31T22:00:00.000Z'};

  state.data.patients=[p1,p2];
  state.data.appointments=[aOld,aTarget,aP2];
  state.data.records=[oldRecord];
  state.data.settings=[];
  await db.bulkPutEncryptedAtomic([
    {storeName:'patients',values:[p1,p2]},
    {storeName:'appointments',values:[aOld,aTarget,aP2]},
    {storeName:'records',values:[oldRecord]}
  ],key,{verify:true});

  await import('../assets/js/record-persistence-v322.js');
  const engine=globalThis.__rmRecordPersistence;
  assert(engine?.version==='3.2.4','record persistence v3.2.4 not active');

  document.getElementById('record-session').value='p1-old';
  await engine.hydrate({forceKey:'p1-old'});
  await wait(10);
  assert(document.getElementById('record-text').value===oldRecord.text,'old final record did not hydrate unchanged');
  assert(document.getElementById('record-followup').value==='','legacy sessionSummary leaked into the followup field');

  document.getElementById('record-session').value='p1-target';
  document.getElementById('record-session').dispatchEvent(new Event('change',{bubbles:true}));
  await wait(20);
  assert(document.getElementById('record-date').value==='2026-09-21','target date not bound to 21/09/2026');
  assert(document.getElementById('record-time').value==='19:00','target time not bound to 19:00');
  document.getElementById('record-title').value='Evolução de sessão';
  document.getElementById('record-text').value='Novo prontuário sintético da sessão de 21/09.';
  document.getElementById('record-followup').value='Retomar comunicação, flexibilidade e validação interna.';
  const finalized=await engine.finalize();
  assert(finalized===true,'target record did not finalize');

  const target=state.data.records.find(r=>r?.patientId==='p1'&&r?.clinicalSessionId==='p1-target');
  assert(target,'target record missing from state');
  assert(target.appointmentId==='a-target','target appointmentId mismatch');
  assert(target.date==='2026-09-21'&&target.time==='19:00','target date/time mismatch');
  assert(target.status==='Finalizado','target record not finalized');
  assert(target.followup==='Retomar comunicação, flexibilidade e validação interna.','followup not saved in its own field');
  const storedTarget=await db.getDecryptedById('records',target.id,key);
  assert(storedTarget?.patientId==='p1'&&storedTarget?.clinicalSessionId==='p1-target'&&storedTarget?.appointmentId==='a-target','stored target linkage mismatch');

  const storedOld=await db.getDecryptedById('records','record-old',key);
  assert(storedOld?.text===oldRecord.text,'31/08 historical text was modified');
  assert(storedOld?.sessionSummary===oldRecord.sessionSummary,'31/08 historical metadata was modified');
  assert(storedOld?.updatedAt===oldRecord.updatedAt,'31/08 historical timestamp was modified');

  state.runtime.selectedPatientId='p2';
  document.getElementById('record-session').value='p1-target';
  document.getElementById('record-date').value='2026-09-21';
  document.getElementById('record-time').value='19:00';
  document.getElementById('record-text').value='Cross-patient write must be blocked.';
  let blocked=false;
  try{await engine.save()}catch(error){blocked=String(error?.message||error).includes('não pertence ao paciente atual')}
  assert(blocked,'cross-patient session write was not blocked');
  assert(!state.data.records.some(r=>r?.patientId==='p2'&&r?.clinicalSessionId==='p1-target'),'cross-patient record contaminated state');

  result.dataset.e2e='ok';
  result.textContent='RECORD_SESSION_ISOLATION_PASS';
}catch(error){if(result.dataset.e2e!=='fail'){result.dataset.e2e='fail';result.textContent=`RECORD_SESSION_ISOLATION_FAIL: ${error?.message||error}`}}
</script>
</body></html>
