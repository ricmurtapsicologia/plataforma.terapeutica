<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autoteste — Plataforma Clínica v3.3.0</title><style>body{font:16px/1.5 system-ui;margin:0;background:#f4f8fa;color:#20343d}.shell{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #c9dde4;border-radius:16px;padding:18px;margin:12px 0}.ok{color:#247c68}.fail{color:#9f2f40}button{padding:10px 14px;border:0;border-radius:10px;background:#3f98b6;color:#fff;font-weight:700}</style></head>
<body><main class="shell"><h1>Autoteste não destrutivo — v3.3.0</h1><p>Valida versão, runtime consolidado, persistência, Agenda Controller, plano terapêutico, pagamentos por sessão e PDF clínico.</p><button id="run">Executar testes</button><div id="summary" class="card">Aguardando execução.</div><div id="results"></div></main>
<script type="module">
import {APP_VERSION,SCHEMA_VERSION,STORE_NAMES} from '../assets/js/state.js?v=3.3.0';
const out=document.getElementById('results'),summary=document.getElementById('summary');let pass=0,fail=0;
function line(name,ok){ok?pass++:fail++;const d=document.createElement('div');d.className='card '+(ok?'ok':'fail');d.textContent=`${ok?'APROVADO':'FALHOU'} — ${name}`;out.append(d)}
async function text(path){const r=await fetch(new URL(path,location.href),{cache:'no-store'});return r.ok?await r.text():''}
async function run(){out.innerHTML='';pass=fail=0;line('Versão 3.3.0',APP_VERSION==='3.3.0');line('Schema clínico preservado',SCHEMA_VERSION===5&&STORE_NAMES.includes('appointments')&&STORE_NAMES.includes('records'));const index=await text('../index.html?build=330');line('Entrypoint v3.3.0',index.includes('main-v250.js?v=3.3.0')&&index.includes('agenda-v330.css?v=3.3.0')&&index.includes('3.3.0-main-v250')&&index.includes('gmail.googleapis.com'));const main=await text('../assets/js/main-v250.js?v=3.3.0');const retired=['runtime-monitor-v240.js','legacy-sw-cleanup-v240.js','browser-fixes-v153.js','top-status-owner-v243.js','gemini-materialization-integrity-v273.js','workspace-status-v240.js','agenda-actions-v240.js'];line('Runtime consolidado',main.includes('platform-runtime-v300.js')&&retired.every(name=>!main.includes(name)));line('Automação clínica ativa',['record-persistence-v320.js','treatment-plan-intelligence-v320.js','patient-delivery-finance-v320.js','clinical-orchestrator-v320.js','session-payment-visibility-v322.js'].every(name=>main.includes(name)));line('Agenda Controller único',main.includes('agenda-controller-v330.js')&&!main.includes('agenda-actions-v240.js'));const agenda=await text('../assets/js/agenda-controller-v330.js?v=3.3.0');const desktop=await text('../assets/js/modules/appointments.js?v=3.3.0');const mobile=await text('../assets/js/agenda-mobile-v183.js?v=3.3.0');line('Agenda sem microbotões anônimos',desktop.includes('data-action="appointment-open"')&&!desktop.includes('week-mini')&&!desktop.includes('week-event-actions'));line('Desktop e mobile no mesmo controlador',desktop.includes('data-action="appointment-open"')&&mobile.includes('data-action="appointment-open"')&&!mobile.includes('appointment-manage'));line('Presença com persistência verificada',agenda.includes("putEncrypted('appointments'")&&agenda.includes("getDecryptedById('appointments'"));line('Exclusão exige confirmação',agenda.includes('agenda-delete-request-v330')&&agenda.includes('agenda-delete-confirm-v330'));const database=await text('../assets/js/database.js?v=3.3.0');const put=database.slice(database.indexOf('export async function putEncrypted'),database.indexOf('export async function bulkPutEncrypted'));line('Criptografia antes da transação',put.indexOf('prepareEncryptedRow')>=0&&put.indexOf('prepareEncryptedRow')<put.indexOf("db.transaction(storeName,'readwrite')"));line('Persistência atômica verificável',database.includes('bulkPutEncryptedAtomic')&&database.includes('getDecryptedById'));const gemini=await text('../assets/js/clinical-reconcile-v270.js?v=3.3.0');line('Materialização não depende de Dados ✓',!gemini.includes("syncState!=='synced'")&&gemini.includes("syncState==='conflict'"));const payments=await text('../assets/js/session-payment-visibility-v322.js?v=3.3.0');line('Pagamento desacoplado da Agenda',payments.includes('prepareAppointment:id=>setPending(id)')&&!payments.includes("action==='appointment-manage'"));const pdf=await text('../assets/js/pdf-engine-v320.js?v=3.3.0');const delivery=await text('../assets/js/patient-delivery-finance-v320.js?v=3.3.0');line('PDF real e envio com anexo',pdf.includes('%PDF-1.4')&&delivery.includes('application/pdf')&&delivery.includes('gmail.send'));summary.textContent=`Resultado: ${pass} aprovado(s), ${fail} falha(s).`;summary.className='card '+(fail?'fail':'ok')}
document.getElementById('run').addEventListener('click',run);
</script></body></html>
