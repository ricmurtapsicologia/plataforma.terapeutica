<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autoteste — Plataforma Clínica</title><style>body{font:16px/1.5 system-ui;margin:0;background:#f4f8fa;color:#20343d}.shell{max-width:980px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #c9dde4;border-radius:16px;padding:18px;margin:12px 0}.ok{color:#247c68}.fail{color:#9f2f40}.warn{color:#72520d}button{padding:10px 14px;border:0;border-radius:10px;background:#3f98b6;color:#fff;font-weight:700}.meta{font-size:13px;color:#526b75}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.summary{font-size:20px;font-weight:700}</style></head><body><main class="shell"><h1>Autoteste não destrutivo — v2.3.0</h1><p>Valida criptografia, arquivos críticos, conciliação Gemini desde maio, normalização de horários, prontuário automático, revisão profissional e proteção contra conflito. Não abre nem modifica o cofre clínico real.</p><button id="run">Executar testes</button><div id="summary" class="card summary">Aguardando execução.</div><div id="results" class="grid"></div></main><script type="module">
import {deriveKey,randomBytes,encryptJson,decryptJson,sha256} from '../assets/js/crypto.js?v=2.3.0';
import {STORE_NAMES,SCHEMA_VERSION,APP_VERSION} from '../assets/js/state.js?v=2.3.0';
const out=document.getElementById('results'),summary=document.getElementById('summary');let pass=0,fail=0,warn=0;
function line(name,status,details=''){if(status==='ok')pass++;else if(status==='fail')fail++;else warn++;const d=document.createElement('div');d.className='card';d.innerHTML=`<strong class="${status}">${status==='ok'?'APROVADO':status==='fail'?'FALHOU':'ATENÇÃO'}</strong> — ${name}${details?`<div class="meta">${details}</div>`:''}`;out.append(d)}
async function fetchOk(path){const r=await fetch(new URL(path,location.href),{cache:'no-store'});return{ok:r.ok,text:r.ok?await r.text():''}}
async function testIDB(){return new Promise((resolve,reject)=>{const name='rm-selftest-'+Date.now(),r=indexedDB.open(name,1);r.onupgradeneeded=()=>r.result.createObjectStore('x');r.onerror=()=>reject(r.error);r.onsuccess=()=>{const db=r.result,tx=db.transaction('x','readwrite');tx.objectStore('x').put('ok','a');tx.oncomplete=()=>{const g=db.transaction('x').objectStore('x').get('a');g.onsuccess=()=>{const ok=g.result==='ok';db.close();indexedDB.deleteDatabase(name);resolve(ok)}}}})}
async function run(){out.innerHTML='';pass=0;fail=0;warn=0;try{
 line('Versão centralizada',APP_VERSION==='2.3.0'?'ok':'fail',APP_VERSION);line('Schema preservado',SCHEMA_VERSION>=5?'ok':'fail',String(SCHEMA_VERSION));line('Stores clínicas preservadas',STORE_NAMES.includes('patients')&&STORE_NAMES.includes('appointments')&&STORE_NAMES.includes('records')?'ok':'fail');line('Web Crypto',crypto?.subtle?'ok':'fail');const key=await deriveKey('senha-teste',randomBytes(16),1000),payload=await encryptJson(key,{ok:true},'selftest'),plain=await decryptJson(key,payload,'selftest');line('AES-GCM',plain.ok?'ok':'fail');line('SHA-256',(await sha256('abc')).length===64?'ok':'fail');line('IndexedDB temporário',await testIDB()?'ok':'fail');
 const files=['../assets/js/clinical-reconcile-v230.js?v=2.3.0','../assets/js/ai-record-review-v220.js?v=2.3.0','../assets/js/sync-conflict-recovery-v220.js?v=2.3.0','../assets/js/workspace-status-v220.js?v=2.3.0','../assets/css/google-clinical-v220.css?v=2.3.0'];for(const f of files){const r=await fetchOk(f);line(`Arquivo ${f.split('/').pop().split('?')[0]}`,r.ok?'ok':'fail')}
 const index=await fetchOk('../index.html?v=2.3.0');line('Index usa conciliação v2.3',index.ok&&index.text.includes('clinical-reconcile-v230.js')&&!index.text.includes('google-gemini-clinical-v220.js')?'ok':'fail');line('Revisão profissional carregada',index.ok&&index.text.includes('ai-record-review-v220.js')?'ok':'fail');line('Recuperação de conflito carregada',index.ok&&index.text.includes('sync-conflict-recovery-v220.js')?'ok':'fail');
 const gemini=await fetchOk('../assets/js/clinical-reconcile-v230.js?v=2.3.0');line('Backfill desde 01/05/2026',gemini.text.includes("BACKFILL_DATE='2026-05-01'")&&gemini.text.includes("BACKFILL_ISO='2026-05-01T03:00:00Z'")?'ok':'fail');line('Normalização 20:04 → 20:00',gemini.text.includes('normalizeAgendaSlot')&&gemini.text.includes("m>=30")?'ok':'fail');line('Associação nominal e alias aprendida',gemini.text.includes('buildLearnedAliases')&&gemini.text.includes('primeiro nome único no cofre')?'ok':'fail');line('Prontuário determinístico',gemini.text.includes('gmrec_${entry.fileId}')&&gemini.text.includes('gmappt_${entry.fileId}')?'ok':'fail');line('Conflito pausa conciliação',gemini.text.includes("syncState==='conflict'")&&gemini.text.includes('Gemini pausado')?'ok':'fail');line('Rascunho IA TCC',gemini.text.includes("status:'Rascunho IA'")&&gemini.text.includes('PROMPT_VERSION')?'ok':'fail');line('Botão Gerar prontuário por IA',gemini.text.includes('Gerar prontuário por IA')&&gemini.text.includes('gemini-ai-generate')?'ok':'fail');line('Ficha individual oculta grade geral',gemini.text.includes("main.querySelector('#patient-grid')?.remove()")&&gemini.text.includes("action==='choose-patient'")?'ok':'fail');line('Transcrição não é copiada',gemini.text.includes("split(/📖\\s*Transcri")?'ok':'fail');line('Service Worker disponível','serviceWorker'in navigator?'ok':'warn');
}catch(e){line('Execução geral','fail',e.message)}summary.textContent=`Resultado: ${pass} aprovado(s), ${fail} falha(s), ${warn} atenção(ões).`;summary.className='card summary '+(fail?'fail':'ok')}
document.getElementById('run').addEventListener('click',run);
</script></body></html>
