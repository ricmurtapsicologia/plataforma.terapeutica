<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autoteste — RM Clínica</title><style>body{font:16px/1.5 system-ui;margin:0;background:#f4f8fa;color:#23363e}.shell{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #d6e7ec;border-radius:16px;padding:18px;margin:12px 0}.ok{color:#247c68}.fail{color:#ad4050}button{padding:10px 14px;border:0;border-radius:10px;background:#4ba4c1;color:#fff;font-weight:700}</style></head><body><main class="shell"><h1>Autoteste não destrutivo</h1><p>Verifica recursos básicos do navegador sem acessar o banco clínico principal.</p><button id="run">Executar testes</button><div id="results"></div></main><script type="module">
import {deriveKey,randomBytes,encryptJson,decryptJson,sha256} from '../assets/js/crypto.js';
import {validEmail,validPhone,safeJson} from '../assets/js/validation.js';
const out=document.getElementById('results');const line=(name,ok,details='')=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<strong class="${ok?'ok':'fail'}">${ok?'APROVADO':'FALHOU'}</strong> — ${name}${details?`<div>${details}</div>`:''}`;out.append(d)};
async function testIDB(){return new Promise((resolve,reject)=>{const name='rm-clinica-selftest-'+Date.now(),r=indexedDB.open(name,1);r.onupgradeneeded=()=>r.result.createObjectStore('x');r.onerror=()=>reject(r.error);r.onsuccess=()=>{const db=r.result,tx=db.transaction('x','readwrite');tx.objectStore('x').put('ok','a');tx.oncomplete=()=>{const t=db.transaction('x','readonly'),g=t.objectStore('x').get('a');g.onsuccess=()=>{const ok=g.result==='ok';db.close();indexedDB.deleteDatabase(name);resolve(ok)}}}})}
document.getElementById('run').onclick=async()=>{out.innerHTML='';try{line('Web Crypto API',Boolean(crypto.subtle));const key=await deriveKey('senha-de-teste-segura',randomBytes(16),1000),payload=await encryptJson(key,{teste:'ok'},'selftest'),plain=await decryptJson(key,payload,'selftest');line('Criptografia AES-GCM',plain.teste==='ok');line('SHA-256',(await sha256('abc')).length===64);line('IndexedDB',await testIDB());line('Validação de e-mail',validEmail('teste@example.com')&&!validEmail('invalido'));line('Validação de telefone',validPhone('+55 35 99999-9999'));line('JSON seguro',safeJson('{"ok":true}').ok===true);line('Service Worker','serviceWorker'in navigator,location.protocol==='https:'?'Contexto HTTPS detectado.':'Teste completo requer GitHub Pages ou localhost.');line('Web Share API','share'in navigator,'A ausência não impede o uso: há fallbacks.');line('Notification API','Notification'in window,'A ausência não impede o uso da plataforma.')}catch(e){line('Execução geral',false,e.message)}};
</script></body></html>
