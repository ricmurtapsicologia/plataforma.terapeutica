<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autoteste — Plataforma Clínica v2.4.11</title><style>body{font:16px/1.5 system-ui;margin:0;background:#f4f8fa;color:#20343d}.shell{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #c9dde4;border-radius:16px;padding:18px;margin:12px 0}.ok{color:#247c68}.fail{color:#9f2f40}button{padding:10px 14px;border:0;border-radius:10px;background:#3f98b6;color:#fff;font-weight:700}</style></head><body><main class="shell"><h1>Autoteste não destrutivo — v2.4.11</h1><p>Valida entrypoint, Agenda única, Gemini, storage público e saneamento de falsos conflitos semanticamente equivalentes.</p><button id="run">Executar testes</button><div id="summary" class="card">Aguardando execução.</div><div id="results"></div></main><script type="module">

async function run(){out.innerHTML='';pass=fail=0;line('Versão 2.4.11',APP_VERSION==='2.4.11');line('Schema clínico preservado',SCHEMA_VERSION===5&&STORE_NAMES.includes('appointments')&&STORE_NAMES.includes('records'));const index=await text('../index.html?v=2.4.11');line('Entrypoint único com cache 2.4.11',index.includes('main-v240.js?v=2.4.11'));const main=await text('../assets/js/main-v240.js?v=2.4.11');line('Main carrega saneamento semântico antes da recuperação',main.indexOf('sync-semantic-conflict-cleanup-v248.js')>=0&&main.indexOf('sync-semantic-conflict-cleanup-v248.js')<main.indexOf('sync-conflict-recovery-v247.js'));line('Main preserva recuperação transacional v2.4.7',main.includes('sync-conflict-recovery-v247.js'));line('Main preserva proprietário único de Agenda',main.includes('top-status-owner-v243.js'));line('Main carrega gate de privacidade antes do Gemini',main.indexOf('gemini-sharing-guard-v250.js')>=0&&main.indexOf('gemini-sharing-guard-v250.js')<main.indexOf('clinical-reconcile-v240.js'));line('Main carrega bloqueio de storage público antes do Gemini',main.indexOf('public-clinical-storage-guard-v251.js')>=0&&main.indexOf('public-clinical-storage-guard-v251.js')<main.indexOf('clinical-reconcile-v240.js'));const storageGuard=await text('../assets/js/public-clinical-storage-guard-v251.js?v=2.4.11');line('Storage público bloqueia escrita no vault GitHub',storageGuard.includes("blockedMethods=new Set(['PUT','POST','PATCH','DELETE'])")&&storageGuard.includes('/contents/.clinic-sync/vault.json'));const semantic=await text('../assets/js/sync-semantic-conflict-cleanup-v248.js?v=2.4.11');line('Exclusão nos dois lados é tratada como equivalente',semantic.includes("l.kind==='d'&&r.kind==='d'"));line('Conteúdo manual idêntico ignora apenas campos voláteis',semantic.includes('VOLATILE')&&semantic.includes('JSON.stringify(prune(l.row))===JSON.stringify(prune(r.row))'));line('Gemini vivo permanece com reconciliador especializado',semantic.includes('if(deterministicGemini(key))return false'));line('Saneamento altera apenas baseline, não o cofre clínico',semantic.includes('localStorage.setItem(BASELINE_STORAGE')&&!semantic.includes('importRawDatabase')&&!semantic.includes('putRemote'));const recovery=await text('../assets/js/sync-conflict-recovery-v247.js?v=2.4.11');line('Resolução real continua transacional',recovery.includes('putRemote')&&recovery.includes('publishResolution'));line('Prontuário finalizado continua protegido',recovery.includes("status==='Finalizado'"));const repair=await text('../assets/js/gemini-name-token-repair-v245.js?v=2.4.11');line('Identidade Gemini continua sem hardcode clínico',repair.includes('uniquePatientByNameValue')&&!repair.includes('MADUNA')&&!repair.includes('Aparecida'));const top=await text('../assets/js/top-status-owner-v243.js?v=2.4.11');line('Somente um chip Agenda é preservado',top.includes('rm-calendar-status-v240')&&top.includes('MutationObserver'));const guard=await text('../assets/js/gemini-sharing-guard-v250.js?v=2.4.11');line('Gemini bloqueia documentos com acesso público',guard.includes("p?.type==='anyone'")&&guard.includes('permission-check-failed'));summary.textContent=`Resultado: ${pass} aprovado(s), ${fail} falha(s).`;summary.className='card '+(fail?'fail':'ok')}
