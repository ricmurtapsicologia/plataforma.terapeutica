<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autoteste — Plataforma Clínica v2.7.2</title><style>body{font:16px/1.5 system-ui;margin:0;background:#f4f8fa;color:#20343d}.shell{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #c9dde4;border-radius:16px;padding:18px;margin:12px 0}.ok{color:#247c68}.fail{color:#9f2f40}button{padding:10px 14px;border:0;border-radius:10px;background:#3f98b6;color:#fff;font-weight:700}</style></head>
<body><main class="shell"><h1>Autoteste não destrutivo — v2.7.2</h1><p>Valida versão, proprietário único do pipeline Gemini, persistência transacional e resolvedor de identidade.</p><button id="run">Executar testes</button><div id="summary" class="card">Aguardando execução.</div><div id="results"></div></main>

import {APP_VERSION,SCHEMA_VERSION,STORE_NAMES} from '../assets/js/state.js?v=2.7.2';

async function text(path){const r=await fetch(new URL(path,location.href),{cache:'no-store'});return r.ok?await r.text():''}
async function run(){out.innerHTML='';pass=fail=0;line('Versão 2.7.2',APP_VERSION==='2.7.2');line('Schema clínico preservado',SCHEMA_VERSION===5&&STORE_NAMES.includes('appointments')&&STORE_NAMES.includes('records'));const index=await text('../index.html?build=272');line('Entrypoint 2.7.2',index.includes('main-v250.js?v=2.7.2')&&index.includes('2.7.2-main-v250'));const main=await text('../assets/js/main-v250.js?v=2.7.2');const retired=['clinical-reconcile-v240.js','gemini-autodelivery-v264.js','gemini-alias-continuity-v263.js','gemini-name-token-repair-v245.js','gemini-migration-v240.js','gemini-attendance-repair-v249.js'];line('Pipeline Gemini com proprietário único',main.includes('clinical-reconcile-v270.js')&&retired.every(name=>!main.includes(name)));const database=await text('../assets/js/database.js?v=2.7.2');const put=database.slice(database.indexOf('export async function putEncrypted'),database.indexOf('export async function bulkPutEncrypted'));line('Criptografia antes da transação',put.indexOf('prepareEncryptedRow')>=0&&put.indexOf('prepareEncryptedRow')<put.indexOf("db.transaction(storeName,'readwrite')"));line('Persistência atômica verificável',database.includes('bulkPutEncryptedAtomic')&&database.includes('getDecryptedById'));const identity=await text('../assets/js/gemini-identity-v270.mjs?v=2.7.2');line('Resolvedor de identidade histórica',identity.includes('learnAliasesFromDocuments')&&identity.includes('before.lastIndexOf(label)'));const gemini=await text('../assets/js/clinical-reconcile-v270.js?v=2.7.2');line('Materialização não depende de Dados ✓',!gemini.includes("syncState!=='synced'")&&gemini.includes("syncState==='conflict'"));line('Sessão + prontuário atômicos',gemini.includes('bulkPutEncryptedAtomic')&&gemini.includes('{verify:true}'));line('Revisão humana disponível',gemini.includes('gemini-review-hub-v270')&&gemini.includes('manualLinks'));summary.textContent=`Resultado: ${pass} aprovado(s), ${fail} falha(s).`;summary.className='card '+(fail document.getElementById('run').addEventListener('click',run);
