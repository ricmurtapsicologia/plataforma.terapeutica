<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autoteste — Plataforma Clínica</title><style>body{font:16px/1.5 system-ui;margin:0;background:#f4f8fa;color:#20343d}.shell{max-width:980px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #c9dde4;border-radius:16px;padding:18px;margin:12px 0}.ok{color:#247c68}.fail{color:#9f2f40}.warn{color:#946715}button{padding:10px 14px;border:0;border-radius:10px;background:#3f98b6;color:#fff;font-weight:700}.small{font-size:.86rem;color:#607984}</style></head>
<body><main class="shell"><h1 id="title">Autoteste não destrutivo</h1><p>Valida o hardening estrutural, financeiro, clínico e de privacidade. Não acessa nem altera o conteúdo cifrado do cofre clínico.</p><button id="run">Executar testes</button><div id="summary" class="card">Aguardando execução.</div><div id="results"></div></main>
<script type="module">
import {APP_VERSION,SCHEMA_VERSION,STORE_NAMES} from '../assets/js/state.js';
import {paymentStateForAppointment,appointmentIsPerformed} from '../assets/js/payment-status-v322.mjs';
const out=document.getElementById('results'),summary=document.getElementById('summary'),title=document.getElementById('title');title.textContent=`Autoteste não destrutivo — v${APP_VERSION}`;let pass=0,fail=0;
function line(name,ok,detail=''){ok?pass++:fail++;const d=document.createElement('div');d.className='card '+(ok?'ok':'fail');d.innerHTML=`<strong>${ok?'APROVADO':'FALHOU'} — ${name}</strong>${detail?`<div class="small">${detail}</div>`:''}`;out.append(d)}
async function text(path){const r=await fetch(new URL(`${path}${path.includes('?')?'&':'?'}test=${Date.now()}`,location.href),{cache:'no-store'});return r.ok?await r.text():''}
async function run(){out.innerHTML='';pass=fail=0;
 line('Versão dinâmica disponível',/^\d+\.\d+\.\d+$/.test(APP_VERSION),`APP_VERSION=${APP_VERSION}`);
 line('Schema clínico preservado',SCHEMA_VERSION===5&&STORE_NAMES.includes('appointments')&&STORE_NAMES.includes('records')&&STORE_NAMES.includes('payments'));
 const index=await text('../index.html');line('Build usa APP_VERSION atual',index.includes(`rm-build\" content=\"${APP_VERSION}`)&&index.includes(`main-v250.js?v=${APP_VERSION}`));
 const paid=paymentStateForAppointment({id:'a1',patientId:'p1',paymentReconciled:true},{payments:[],appointments:[]});line('1. Sessão conciliada → Pago em fonte canônica',paid.code==='paid'&&paid.label==='Pago');
 const explicit=paymentStateForAppointment({id:'a2',patientId:'p1'},{payments:[{id:'x',patientId:'p1',appointmentId:'a2',status:'Pago'}],appointments:[{id:'a2',patientId:'p1'}]});line('1b. Pagamento explícito → Pago',explicit.code==='paid');
 const integrity=await text('../assets/js/clinical-data-integrity-v340.js');line('2. Mensalidade usa competência/ciclo',integrity.includes('competence-package-v360')&&integrity.includes("allowCrossCompetence===true")&&!integrity.includes('nearest-session-auto-v340'));
 line('3. Presente sem prontuário → placeholder editável',integrity.includes("text:'Não há prontuário.'")&&integrity.includes("editable:true")&&integrity.includes('appointmentIsPerformed'));
 line('4. Placeholder só é removido após readback',integrity.includes("getDecryptedById('records'")&&integrity.includes('purgeVerifiedSupersededPlaceholders'));
 const privateRepair=await text('../assets/js/clinical-private-reconciliation-v350.js');line('5. Regressão de conciliação privada sem dados clínicos no código',privateRepair.includes('mergeExplicitDuplicates')&&privateRepair.includes('payerAliases')&&privateRepair.includes('receipts')&&!/Michele|Ágape|Aparecida|Daniele|Ronaldo|Eduardo|Fábio/.test(privateRepair),'Identidades específicas permanecem apenas no patch privado do Google Drive.');
 const patients=await text('../assets/js/modules/patients.js');line('6. Pacientes desativados ficam em caixa recolhida',patients.includes('Pacientes desativados')&&patients.includes('<details')&&patients.includes("['Inativo','Encerrado','Arquivado']"));
 const finance=await text('../assets/js/modules/finance.js');line('7. Inativo não entra na previsão',finance.includes('appointmentValidForPatient')&&finance.includes('appointment.date>todayISO()'));
 line('8. Financeiro usa a mesma fonte canônica da Agenda',finance.includes('paymentStateForAppointment')&&finance.includes('Produzido × recebido × em aberto'));
 const health=await text('../assets/js/clinical-health-engine-v360.js');line('9/10. ClinicalHealthEngine e botão diagnóstico',health.includes('__rmClinicalHealthEngine')&&health.includes('run-diagnostics')&&health.includes('PRESENT_WITHOUT_RECORD'));
 line('11. Autorreparo é desenhado para idempotência',integrity.includes('if(recordsForAppointment(a).length)continue')&&privateRepair.includes('findExistingReceipt'));
 const main=await text('../assets/js/main-v250.js');line('12. Dados clínicos não são codificados no GitHub',![main,integrity,health,finance,patients,privateRepair].some(src=>/Michele Aparecida|Ágape Livraria|Fábio Daufenbach|Eduardo Reis Chaves|Ronaldo de Oliveira/.test(src)));
 const session=await text('../assets/js/session-tcc-prep-v360.js'),form=await text('../assets/js/modules/formulation.js'),assessment=await text('../assets/js/clinical-assessment-v360.js');line('TCC: sessão, formulação e avaliação estruturadas',session.includes('3 prioridades')&&form.includes('Evidências contrárias')&&form.includes('Integrações clínicas — opcional')&&assessment.includes('RELATO DO PACIENTE'));
 const exercises=await text('../assets/js/therapeutic-exercises-v360.js'),audio=await text('../assets/js/audio-assets-v360.js');line('Exercícios guiados e áudio com gate de revisão',exercises.includes('Modo guiado')&&exercises.includes('Exemplo preenchido')&&audio.includes('Aprovado para envio')&&!audio.includes('speechSynthesis'));
 line('Sessão realizada é reconhecida de forma canônica',appointmentIsPerformed({status:'Realizada'})&&appointmentIsPerformed({attendanceStatus:'Presente'}));
 summary.textContent=`Resultado v${APP_VERSION}: ${pass} aprovado(s), ${fail} falha(s). ${fail?'Não liberar até corrigir as falhas estáticas.':'Hardening estático aprovado; a auditoria P0 dos dados cifrados é executada pelo ClinicalHealthEngine após abrir o cofre.'}`;summary.className='card '+(fail?'fail':'ok')}
document.getElementById('run').addEventListener('click',run);
</script></body></html>
