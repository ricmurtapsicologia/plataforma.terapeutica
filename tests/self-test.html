<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Autoteste — Plataforma Clínica</title>
  <style>
    body{font:16px/1.5 system-ui;margin:0;background:#f4f8fa;color:#20343d}.shell{max-width:980px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #c9dde4;border-radius:16px;padding:18px;margin:12px 0}.ok{color:#247c68}.fail{color:#9f2f40}.warn{color:#72520d}button{padding:10px 14px;border:0;border-radius:10px;background:#3f98b6;color:#fff;font-weight:700;min-height:44px}.meta{font-size:13px;color:#526b75}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.grid .card{margin:0}.summary{font-size:20px;font-weight:700}
  </style>
</head>
<body>
<main class="shell">
  <h1>Autoteste não destrutivo — v2.1.1</h1>
  <p>Verifica navegador, criptografia, IndexedDB temporário, arquivos críticos, Google Workspace, importação automática do Gemini, proteção contra conflito, revisão do prontuário, agenda e sincronização. Não abre nem altera o cofre clínico real.</p>
  <button id="run">Executar testes</button>
  <div id="summary" class="card summary">Aguardando execução.</div>
  <div id="results" class="grid"></div>
</main>
<script type="module">
import {deriveKey,randomBytes,encryptJson,decryptJson,sha256} from '../assets/js/crypto.js?v=2.1.1';
import {validEmail,validPhone,safeJson} from '../assets/js/validation.js?v=2.1.1';
import {STORE_NAMES,SCHEMA_VERSION,APP_VERSION,todayISO} from '../assets/js/state.js?v=2.1.1';

const out=document.getElementById('results');
const summary=document.getElementById('summary');
let pass=0,fail=0,warn=0;
function line(name,status,details=''){if(status==='ok')pass++;else if(status==='fail')fail++;else warn++;const d=document.createElement('div');d.className='card';const label=status==='ok'?'APROVADO':status==='fail'?'FALHOU':'ATENÇÃO';d.innerHTML=`<strong class="${status}">${label}</strong> — ${name}${details?`<div class="meta">${details}</div>`:''}`;out.append(d)}
function localToday(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
async function testIDB(){return new Promise((resolve,reject)=>{const name='rm-clinica-selftest-'+Date.now(),r=indexedDB.open(name,1);r.onupgradeneeded=()=>r.result.createObjectStore('x');r.onerror=()=>reject(r.error);r.onsuccess=()=>{const db=r.result,tx=db.transaction('x','readwrite');tx.objectStore('x').put('ok','a');tx.oncomplete=()=>{const t=db.transaction('x','readonly'),g=t.objectStore('x').get('a');g.onsuccess=()=>{const ok=g.result==='ok';db.close();indexedDB.deleteDatabase(name);resolve(ok)}}}})}
async function fetchOk(path){const r=await fetch(new URL(path,location.href),{cache:'no-store'});return{ok:r.ok,status:r.status,text:r.ok?await r.text():''}}
async function run(){
  out.innerHTML='';pass=0;fail=0;warn=0;summary.textContent='Executando…';
  try{
    line('Versão centralizada',APP_VERSION==='2.1.1'?'ok':'fail',`Detectada: ${APP_VERSION}`);
    line('Schema clínico preservado',SCHEMA_VERSION>=5?'ok':'fail',`Schema: ${SCHEMA_VERSION}`);
    line('Stores essenciais preservadas',STORE_NAMES.includes('patients')&&STORE_NAMES.includes('appointments')&&STORE_NAMES.includes('records')&&STORE_NAMES.includes('payments')?'ok':'fail',STORE_NAMES.join(', '));
    line('Data local',todayISO()===localToday()?'ok':'fail');line('Web Crypto API',crypto?.subtle?'ok':'fail');
    const key=await deriveKey('senha-de-teste-segura',randomBytes(16),1000),payload=await encryptJson(key,{teste:'ok'},'selftest'),plain=await decryptJson(key,payload,'selftest');line('Criptografia AES-GCM',plain.teste==='ok'?'ok':'fail');line('SHA-256',(await sha256('abc')).length===64?'ok':'fail');line('IndexedDB isolado',await testIDB()?'ok':'fail','Banco temporário criado e excluído.');line('Validação de e-mail',validEmail('teste@example.com')&&!validEmail('invalido')?'ok':'fail');line('Validação de telefone',validPhone('+55 35 99999-9999')?'ok':'fail');line('JSON seguro',safeJson('{"ok":true}').ok===true?'ok':'fail');
    const files=['../assets/js/version.js?v=2.1.1','../assets/js/google-workspace-oauth-v200.js?v=2.1.1','../assets/js/google-calendar-v168.js?v=2.1.1','../assets/js/google-gemini-clinical-v210.js?v=2.1.1','../assets/js/ai-record-review-v210.js?v=2.1.1','../assets/js/workspace-status-v210.js?v=2.1.1','../assets/js/bootstrap-v151.js?v=2.1.1','../assets/js/app-core-v150.js?v=2.1.1','../assets/js/actions-v150.js?v=2.1.1','../assets/js/agenda-mobile-v183.js?v=2.1.1','../assets/js/mobile-ux-v170.js?v=2.1.1','../assets/js/sync-supervisor-v162.js?v=2.1.1','../assets/js/modules/patients.js?v=2.1.1','../assets/js/modules/records.js?v=2.1.1','../assets/css/google-clinical-v210.css?v=2.1.1','../assets/css/agenda-mobile-v183.css?v=2.1.1'];
    for(const file of files){const r=await fetchOk(file);line(`Arquivo ${file.split('/').pop().split('?')[0]}`,r.ok?'ok':'fail')}
    const index=await fetchOk('../index.html?v=2.1.1');line('Index carrega OAuth antes da Agenda',index.ok&&index.text.indexOf('google-workspace-oauth-v200.js')<index.text.indexOf('google-calendar-v168.js')?'ok':'fail');line('Index carrega importador Gemini v2.1',index.ok&&index.text.includes('google-gemini-clinical-v210.js')&&!index.text.includes('google-gemini-clinical-inbox-v200.js')?'ok':'fail');line('Index carrega revisão IA e status Meet',index.ok&&index.text.includes('ai-record-review-v210.js')&&index.text.includes('workspace-status-v210.js')?'ok':'fail');line('Patches antigos não são carregados',index.ok&&!index.text.includes('agenda-accessibility-v177')&&!index.text.includes('agenda-clarity-v169')&&!index.text.includes('meet-sync-v185')?'ok':'fail');
    const oauth=await fetchOk('../assets/js/google-workspace-oauth-v200.js?v=2.1.1');line('OAuth solicita Agenda + Drive somente leitura',oauth.ok&&oauth.text.includes('calendar.events')&&oauth.text.includes('drive.readonly')?'ok':'fail');
    const gemini=await fetchOk('../assets/js/google-gemini-clinical-v210.js?v=2.1.1');line('Backfill Gemini começa em 01/06/2026',gemini.ok&&gemini.text.includes("BACKFILL_DATE='2026-06-01'")?'ok':'fail');line('Gemini identifica paciente nominalmente',gemini.ok&&gemini.text.includes('identifyPatient')&&gemini.text.includes('participantLabels')?'ok':'fail');line('IDs Gemini são determinísticos',gemini.ok&&gemini.text.includes('gmappt_${fileId}')&&gemini.text.includes('gmrec_${fileId}')?'ok':'fail');line('Gemini grava agenda e prontuário em lote',gemini.ok&&gemini.text.includes("bulkPutEncrypted('appointments'")&&gemini.text.includes("bulkPutEncrypted('records'")?'ok':'fail');line('Backfill aguarda Dados sincronizados',gemini.ok&&gemini.text.includes("syncState!=='synced'")&&gemini.text.includes('Aguardando Dados ✓')?'ok':'fail');line('Conflito pausa importação Gemini',gemini.ok&&gemini.text.includes("syncState==='conflict'")&&gemini.text.includes('Importação pausada')?'ok':'fail');line('Importação não replica eventos históricos para Google Agenda',gemini.ok&&gemini.text.includes("source:'gemini-backfill'")&&gemini.text.includes("storeName:'records'")?'ok':'fail');line('Registros entram como Rascunho IA',gemini.ok&&gemini.text.includes("status:'Rascunho IA'")&&gemini.text.includes('requiresReview:true')?'ok':'fail');line('Registro finalizado não é sobrescrito',gemini.ok&&gemini.text.includes("existing?.status==='Finalizado'")?'ok':'fail');line('Sessão cancelada não é reativada silenciosamente',gemini.ok&&gemini.text.includes("existing.status==='Cancelada'")&&gemini.text.includes("existing.attendanceStatus==='Desmarcou'")?'ok':'fail');line('Drive API desabilitada recebe diagnóstico específico',gemini.ok&&gemini.text.includes('DRIVE_API_DISABLED')&&gemini.text.includes('drive.googleapis.com')?'ok':'fail');
    const review=await fetchOk('../assets/js/ai-record-review-v210.js?v=2.1.1');line('Rascunho IA é revisado sem duplicar registro',review.ok&&review.text.includes('review-ai-record')&&review.text.includes('runtime.aiReviewRecordId')&&review.text.includes("status:'Finalizado'")?'ok':'fail');const status=await fetchOk('../assets/js/workspace-status-v210.js?v=2.1.1');line('Topbar possui indicador Meet',status.ok&&status.text.includes('Meet ✓')&&status.text.includes('rm-meet-status')?'ok':'fail');
    const patients=await fetchOk('../assets/js/modules/patients.js?v=2.1.1');line('Paciente possui Sessões e Prontuário',patients.ok&&patients.text.includes("['timeline','Sessões']")&&patients.text.includes("['records','Prontuário']")?'ok':'fail');const appointments=await fetchOk('../assets/js/modules/appointments.js?v=2.1.1');line('Agenda semanal cobre 06:00–23:00',appointments.ok&&appointments.text.includes('const START_HOUR=6')&&appointments.text.includes('const END_HOUR=23')?'ok':'fail');const supervisor=await fetchOk('../assets/js/sync-supervisor-v162.js?v=2.1.1');line('Sincronização possui watchdog',supervisor.ok&&supervisor.text.includes('WATCHDOG_MS=10000')&&supervisor.text.includes('STALE_AFTER_MS=22000')?'ok':'fail');line('Service Worker disponível','serviceWorker'in navigator?'ok':'warn');
  }catch(e){line('Execução geral','fail',e.message)}
  summary.textContent=`Resultado: ${pass} aprovado(s), ${fail} falha(s), ${warn} atenção(ões).`;summary.className='card summary '+(fail?'fail':'ok');
}
document.getElementById('run').addEventListener('click',run);
</script>
</body>
</html>
