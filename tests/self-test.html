<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autoteste — Plataforma Clínica</title><style>body{font:16px/1.5 system-ui;margin:0;background:#f4f8fa;color:#20343d}.shell{max-width:1050px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #c9dde4;border-radius:16px;padding:18px;margin:12px 0}.ok{color:#247c68}.fail{color:#9f2f40}.warn{color:#72520d}button{padding:10px 14px;border:0;border-radius:10px;background:#3f98b6;color:#fff;font-weight:700}.meta{font-size:13px;color:#526b75}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.summary{font-size:20px;font-weight:700}</style></head><body><main class="shell"><h1>Autoteste não destrutivo — v2.4.0</h1><p>Valida criptografia, entrypoint único, boot resiliente, sincronização event-driven, Google Workspace unificado, Agenda sem OAuth duplicado, Gemini incremental e contexto individual do paciente. Não abre nem modifica o cofre clínico real.</p><button id="run">Executar testes</button><div id="summary" class="card summary">Aguardando execução.</div><div id="results" class="grid"></div></main><script type="module">
import {deriveKey,randomBytes,encryptJson,decryptJson,sha256} from '../assets/js/crypto.js?v=2.4.0';
import {STORE_NAMES,SCHEMA_VERSION,APP_VERSION} from '../assets/js/state.js?v=2.4.0';
const out=document.getElementById('results'),summary=document.getElementById('summary');let pass=0,fail=0,warn=0;
function line(name,status,details=''){if(status==='ok')pass++;else if(status==='fail')fail++;else warn++;const d=document.createElement('div');d.className='card';d.innerHTML=`<strong class="${status}">${status==='ok'?'APROVADO':status==='fail'?'FALHOU':'ATENÇÃO'}</strong> — ${name}${details?`<div class="meta">${details}</div>`:''}`;out.append(d)}
async function fetchOk(path){const r=await fetch(new URL(path,location.href),{cache:'no-store'});return{ok:r.ok,text:r.ok?await r.text():''}}
async function testIDB(){return new Promise((resolve,reject)=>{const name='rm-selftest-'+Date.now(),r=indexedDB.open(name,1);r.onupgradeneeded=()=>r.result.createObjectStore('x');r.onerror=()=>reject(r.error);r.onsuccess=()=>{const db=r.result,tx=db.transaction('x','readwrite');tx.objectStore('x').put('ok','a');tx.oncomplete=()=>{const g=db.transaction('x').objectStore('x').get('a');g.onsuccess=()=>{const ok=g.result==='ok';db.close();indexedDB.deleteDatabase(name);resolve(ok)}}}})}
async function run(){out.innerHTML='';pass=0;fail=0;warn=0;try{
 line('Versão centralizada',APP_VERSION==='2.4.0'?'ok':'fail',APP_VERSION);line('Schema preservado',SCHEMA_VERSION===5?'ok':'fail',String(SCHEMA_VERSION));line('Stores clínicas preservadas',STORE_NAMES.includes('patients')&&STORE_NAMES.includes('appointments')&&STORE_NAMES.includes('records')?'ok':'fail');line('Web Crypto',crypto?.subtle?'ok':'fail');const key=await deriveKey('senha-teste',randomBytes(16),1000),payload=await encryptJson(key,{ok:true},'selftest'),plain=await decryptJson(key,payload,'selftest');line('AES-GCM',plain.ok?'ok':'fail');line('SHA-256',(await sha256('abc')).length===64?'ok':'fail');line('IndexedDB temporário',await testIDB()?'ok':'fail');
 const files=['../assets/js/main-v240.js?v=2.4.0','../assets/js/bootstrap-v240.js?v=2.4.0','../assets/js/secure-sync-v240.js?v=2.4.0','../assets/js/google-calendar-service-v240.js?v=2.4.0','../assets/js/clinical-reconcile-v240.js?v=2.4.0','../assets/js/patient-ux-v240.js?v=2.4.0','../assets/js/agenda-actions-v240.js?v=2.4.0','../assets/js/workspace-status-v240.js?v=2.4.0','../assets/js/runtime-monitor-v240.js?v=2.4.0'];for(const f of files){const r=await fetchOk(f);line(`Arquivo ${f.split('/').pop().split('?')[0]}`,r.ok?'ok':'fail')}
 const index=await fetchOk('../index.html?v=2.4.0');line('Entrypoint único',index.ok&&index.text.includes('main-v240.js')&&![...index.text.matchAll(/<script\s+type="module"/g)].slice(1).length?'ok':'fail');line('Boot fallback presente',index.text.includes('rm-boot-fallback')&&index.text.includes('Inicializando ambiente seguro')?'ok':'fail');const retired=['sync-supervisor-v162.js','google-calendar-v168.js','clinical-reconcile-v230.js','optimization-v180.js','agenda-enhancements-v152.js','agenda-tools-v162.js','workspace-status-v220.js','sw-coop-register-v165.js'];line('Módulos concorrentes fora do index',retired.every(x=>!index.text.includes(x))?'ok':'fail');
 const main=await fetchOk('../assets/js/main-v240.js?v=2.4.0');line('Main controla ordem de boot',main.text.includes('bootstrap-v240.js')&&main.text.includes('google-calendar-service-v240.js')&&main.text.includes('clinical-reconcile-v240.js')?'ok':'fail');line('Watchdog de boot',main.text.includes('12000')&&main.text.includes('rm-boot-fallback')?'ok':'fail');
 const sync=await fetchOk('../assets/js/secure-sync-v240.js?v=2.4.0');line('Sync event-driven',sync.text.includes('PUSH_DEBOUNCE_MS=1600')&&sync.text.includes('HEARTBEAT_MS=90000')?'ok':'fail');line('Eleição de aba líder',sync.text.includes('BroadcastChannel')&&sync.text.includes('sync.leader')?'ok':'fail');line('Sync não usa supervisor por clique',!sync.text.includes('syncButton().click')&&!sync.text.includes('WATCHDOG_MS')?'ok':'fail');line('Patch localizado após mudança remota',sync.text.includes("rm:data-patched")&&sync.text.includes('changedStoresBetween')?'ok':'fail');
 const calendar=await fetchOk('../assets/js/google-calendar-service-v240.js?v=2.4.0');line('Agenda usa token Workspace único',calendar.text.includes("TOKEN_STORAGE='rm.google.calendar.token.v1'")&&calendar.text.includes('workspace-connect')?'ok':'fail');line('Agenda sem OAuth próprio',!calendar.text.includes('accounts.google.com/o/oauth2')&&!calendar.text.includes('response_type')?'ok':'fail');line('Histórico legado protegido contra duplicação',calendar.text.includes("a.date>=today||mirror.has(a.id)")?'ok':'fail');
 const gemini=await fetchOk('../assets/js/clinical-reconcile-v240.js?v=2.4.0');line('Backfill desde maio',gemini.text.includes("BACKFILL_ISO='2026-05-01T03:00:00Z'")?'ok':'fail');line('Fila Gemini limitada',gemini.text.includes('CONCURRENCY=2')&&gemini.text.includes('mapLimit')?'ok':'fail');line('Incremental por modifiedTime',gemini.text.includes('prev.modifiedTime!==file.modifiedTime')?'ok':'fail');line('Relógio da fonte separado',gemini.text.includes('sourceModifiedAt')&&gemini.text.includes('nextStamp')?'ok':'fail');line('IDs determinísticos',gemini.text.includes('gmrec_${entry.fileId}')&&gemini.text.includes('gmappt_${entry.fileId}')?'ok':'fail');line('Conflito pausa Gemini',gemini.text.includes("syncState==='conflict'")&&gemini.text.includes('Gemini pausado')?'ok':'fail');line('Rascunho IA e prompt TCC',gemini.text.includes("status:'Rascunho IA'")&&gemini.text.includes("PROMPT_VERSION='TCC-CFP-v2.4'")?'ok':'fail');line('Transcrição integral excluída',gemini.text.includes("split(/📖\\s*Transcri")?'ok':'fail');
 const patient=await fetchOk('../assets/js/patient-ux-v240.js?v=2.4.0');line('Ficha individual oculta lista geral',patient.text.includes('rm-patient-focused')&&patient.text.includes('#patient-grid')?'ok':'fail');line('Atalho de prontuário IA',patient.text.includes('Gerar prontuário por IA')&&patient.text.includes('gemini-ai-hub-v240')?'ok':'fail');
 const sw=await fetchOk('../assets/js/legacy-sw-cleanup-v240.js?v=2.4.0');line('Service worker legado removido sem reload',sw.text.includes('unregister')&&!sw.text.includes('location.reload')?'ok':'fail');
}catch(e){line('Execução geral','fail',e.message)}summary.textContent=`Resultado: ${pass} aprovado(s), ${fail} falha(s), ${warn} atenção(ões).`;summary.className='card summary '+(fail?'fail':'ok')}
document.getElementById('run').addEventListener('click',run);
</script></body></html>
