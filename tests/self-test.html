<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autoteste — Plataforma Clínica v2.4.7</title><style>body{font:16px/1.5 system-ui;margin:0;background:#f4f8fa;color:#20343d}.shell{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #c9dde4;border-radius:16px;padding:18px;margin:12px 0}.ok{color:#247c68}.fail{color:#9f2f40}button{padding:10px 14px;border:0;border-radius:10px;background:#3f98b6;color:#fff;font-weight:700}</style></head><body><main class="shell"><h1>Autoteste não destrutivo — v2.4.7</h1><p>Valida entrypoint, Gemini, Agenda única e resolução parcial de conflitos publicada no cofre remoto.</p><button id="run">Executar testes</button><div id="summary" class="card">Aguardando execução.</div><div id="results"></div></main><script type="module">
import {APP_VERSION,SCHEMA_VERSION,STORE_NAMES} from '../assets/js/state.js?v=2.4.7';
const out=document.getElementById('results'),summary=document.getElementById('summary');let pass=0,fail=0;
function line(name,ok){ok?pass++:fail++;const d=document.createElement('div');d.className='card '+(ok?'ok':'fail');d.textContent=`${ok?'APROVADO':'FALHOU'} — ${name}`;out.append(d)}
async function text(path){const r=await fetch(new URL(path,location.href),{cache:'no-store'});return r.ok?await r.text():''}
async function run(){out.innerHTML='';pass=fail=0;line('Versão 2.4.7',APP_VERSION==='2.4.7');line('Schema clínico preservado',SCHEMA_VERSION===5&&STORE_NAMES.includes('appointments')&&STORE_NAMES.includes('records'));const index=await text('../index.html?v=2.4.7');line('Entrypoint único com cache 2.4.7',index.includes('main-v240.js?v=2.4.7'));const main=await text('../assets/js/main-v240.js?v=2.4.7');line('Main usa recuperação v2.4.7',main.includes('sync-conflict-recovery-v247.js')&&!main.includes('sync-conflict-recovery-v240.js'));line('Main preserva reparo de identidade Gemini',main.includes('gemini-name-token-repair-v245.js'));line('Main preserva proprietário único de Agenda',main.includes('top-status-owner-v243.js'));const recovery=await text('../assets/js/sync-conflict-recovery-v247.js?v=2.4.7');line('Resolução parcial grava diretamente no cofre remoto',recovery.includes('putRemote')&&recovery.includes('makeEnvelope')&&recovery.includes('publishResolution'));line('Conflitos não resolvidos preservam baseline anterior',recovery.includes("newBase[key]=oldBase[key]||'n|'"));line('Prontuário finalizado fica fora da resolução Gemini',recovery.includes("status==='Finalizado'"));line('Conflito Gemini divergente exige comando explícito deste dispositivo',recovery.includes('sync-use-local-gemini')&&recovery.includes('Usar este dispositivo no Gemini'));line('Conflitos manuais são resolvidos um a um',recovery.includes('sync-one-local')&&recovery.includes('sync-one-remote')&&recovery.includes('Revisar conflitos manuais'));const repair=await text('../assets/js/gemini-name-token-repair-v245.js?v=2.4.7');line('Identidade por componente único permanece genérica',repair.includes('uniquePatientByNameValue')&&repair.includes('nameTokens')&&!repair.includes('MADUNA')&&!repair.includes('Aparecida'));const top=await text('../assets/js/top-status-owner-v243.js?v=2.4.7');line('Somente um chip Agenda é preservado',top.includes('rm-calendar-status-v240')&&top.includes('MutationObserver'));summary.textContent=`Resultado: ${pass} aprovado(s), ${fail} falha(s).`;summary.className='card '+(fail?'fail':'ok')}
document.getElementById('run').addEventListener('click',run);
</script></body></html>
