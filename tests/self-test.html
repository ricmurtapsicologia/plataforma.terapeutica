<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autoteste — Plataforma Clínica v2.5.0</title><style>body{font:16px/1.5 system-ui;margin:0;background:#f4f8fa;color:#20343d}.shell{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #c9dde4;border-radius:16px;padding:18px;margin:12px 0}.ok{color:#247c68}.fail{color:#9f2f40}button{padding:10px 14px;border:0;border-radius:10px;background:#3f98b6;color:#fff;font-weight:700}</style></head><body><main class="shell"><h1>Autoteste não destrutivo — v2.5.0</h1><p>Valida entrypoint, Agenda, Gemini, storage privado no Google Drive e bloqueio do storage público legado.</p><button id="run">Executar testes</button><div id="summary" class="card">Aguardando execução.</div><div id="results"></div></main><script type="module">
import {APP_VERSION,SCHEMA_VERSION,STORE_NAMES} from '../assets/js/state.js?v=2.5.0';
const out=document.getElementById('results'),summary=document.getElementById('summary');let pass=0,fail=0;
function line(name,ok){ok?pass++:fail++;const d=document.createElement('div');d.className='card '+(ok?'ok':'fail');d.textContent=`${ok?'APROVADO':'FALHOU'} — ${name}`;out.append(d)}
async function text(path){const r=await fetch(new URL(path,location.href),{cache:'no-store'});return r.ok?await r.text():''}
async function run(){out.innerHTML='';pass=fail=0;line('Versão 2.5.0',APP_VERSION==='2.5.0');line('Schema clínico preservado',SCHEMA_VERSION===5&&STORE_NAMES.includes('appointments')&&STORE_NAMES.includes('records'));const index=await text('../index.html?v=2.5.0');line('Entrypoint único com cache 2.5.0',index.includes('main-v240.js?v=2.5.0'));const main=await text('../assets/js/main-v240.js?v=2.5.0');line('Main preserva proprietário único de Agenda',main.includes('top-status-owner-v243.js'));line('Main carrega gate de privacidade antes do Gemini',main.indexOf('gemini-sharing-guard-v250.js')>=0&&main.indexOf('gemini-sharing-guard-v250.js')<main.indexOf('clinical-reconcile-v240.js'));line('Main mantém bloqueio do storage público legado',main.includes('public-clinical-storage-guard-v251.js'));line('Main usa saneamento de conflitos do storage privado',main.includes('sync-semantic-conflict-cleanup-v260.js')&&!main.includes('sync-conflict-recovery-v247.js'));const bootstrap=await text('../assets/js/bootstrap-v240.js?v=2.5.0');line('Bootstrap usa SyncManager privado v260',bootstrap.includes("from './secure-sync-v260.js'")&&!bootstrap.includes("from './secure-sync-v240.js'"));const oauth=await text('../assets/js/google-workspace-oauth-v200.js?v=2.5.0');line('OAuth inclui autorização do appDataFolder',oauth.includes('WORKSPACE_REQUIRED_SCOPES'));const token=await text('../assets/js/google-workspace-token-v260.js?v=2.5.0');line('Escopo drive.appdata definido',token.includes('https://www.googleapis.com/auth/drive.appdata'));const storage=await text('../assets/js/drive-appdata-storage-v260.js?v=2.5.0');line('Adapter usa appDataFolder',storage.includes("spaces:'appDataFolder'")&&storage.includes("parents:['appDataFolder']"));line('Adapter valida concorrência e gravação',storage.includes("err.code='RETRY'")||storage.includes("'RETRY'"));const sync=await text('../assets/js/secure-sync-v260.js?v=2.5.0');line('Sync privado não grava no GitHub',sync.includes('google-drive-appdata')&&!sync.includes('api.github.com'));line('Sync privado preserva heartbeat e liderança de abas',sync.includes('HEARTBEAT_MS=90000')&&sync.includes('BroadcastChannel'));const storageGuard=await text('../assets/js/public-clinical-storage-guard-v251.js?v=2.5.0');line('Storage público continua bloqueado',storageGuard.includes("blockedMethods=new Set(['PUT','POST','PATCH','DELETE'])")&&storageGuard.includes('/contents/.clinic-sync/vault.json'));const guard=await text('../assets/js/gemini-sharing-guard-v250.js?v=2.5.0');line('Gemini bloqueia documentos com acesso público',guard.includes("p?.type==='anyone'")&&guard.includes('permission-check-failed'));summary.textContent=`Resultado: ${pass} aprovado(s), ${fail} falha(s).`;summary.className='card '+(fail?'fail':'ok')}
document.getElementById('run').addEventListener('click',run);
</script></body></html>
