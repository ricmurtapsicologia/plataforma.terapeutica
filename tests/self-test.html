<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autoteste — Plataforma Clínica v2.4.6</title><style>body{font:16px/1.5 system-ui;margin:0;background:#f4f8fa;color:#20343d}.shell{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #c9dde4;border-radius:16px;padding:18px;margin:12px 0}.ok{color:#247c68}.fail{color:#9f2f40}button{padding:10px 14px;border:0;border-radius:10px;background:#3f98b6;color:#fff;font-weight:700}</style></head><body><main class="shell"><h1>Autoteste não destrutivo — v2.4.6</h1><p>Valida identificação Gemini, materialização clínica, Agenda única e separação entre conflitos automáticos e manuais.</p><button id="run">Executar testes</button><div id="summary" class="card">Aguardando execução.</div><div id="results"></div></main><script type="module">
import {APP_VERSION,SCHEMA_VERSION,STORE_NAMES} from '../assets/js/state.js?v=2.4.6';
const out=document.getElementById('results'),summary=document.getElementById('summary');let pass=0,fail=0;
function line(name,ok){ok?pass++:fail++;const d=document.createElement('div');d.className='card '+(ok?'ok':'fail');d.textContent=`${ok?'APROVADO':'FALHOU'} — ${name}`;out.append(d)}
async function text(path){const r=await fetch(new URL(path,location.href),{cache:'no-store'});return r.ok?await r.text():''}
async function run(){out.innerHTML='';pass=fail=0;line('Versão 2.4.6',APP_VERSION==='2.4.6');line('Schema clínico preservado',SCHEMA_VERSION===5&&STORE_NAMES.includes('appointments')&&STORE_NAMES.includes('records'));const index=await text('../index.html?v=2.4.6');line('Entrypoint único com cache 2.4.6',index.includes('main-v240.js?v=2.4.6'));const main=await text('../assets/js/main-v240.js?v=2.4.6');line('Main preserva reparo de identidade Gemini',main.includes('gemini-name-token-repair-v245.js'));line('Main preserva proprietário único de Agenda',main.includes('top-status-owner-v243.js'));const repair=await text('../assets/js/gemini-name-token-repair-v245.js?v=2.4.6');line('Componente único do nome é aceito genericamente',repair.includes('uniquePatientByNameValue')&&repair.includes('nameTokens')&&!repair.includes('MADUNA')&&!repair.includes('Aparecida'));line('Sessão ausente é criada por fileId',repair.includes('gmappt_${d.file.id}')&&repair.includes("status:'Realizada'"));line('Prontuário ausente vira Rascunho IA',repair.includes('gmrec_${d.file.id}')&&repair.includes("status:'Rascunho IA'"));const recovery=await text('../assets/js/sync-conflict-recovery-v240.js?v=2.4.6');line('Conflito Gemini exige mesmo fileId e paciente',recovery.includes('safeGeminiConflict')&&recovery.includes("String(l.row.patientId||'')!==String(r.row.patientId||'')"));line('Prontuário finalizado nunca entra no auto-merge',recovery.includes("l.row.status==='Finalizado'||r.row.status==='Finalizado'"));line('Conflito manual permanece com escolha explícita',recovery.includes('sync-manual-local')&&recovery.includes('sync-manual-remote')&&recovery.includes('Revisar conflito manual'));const top=await text('../assets/js/top-status-owner-v243.js?v=2.4.6');line('Somente um chip Agenda é preservado',top.includes('rm-calendar-status-v240')&&top.includes('MutationObserver'));summary.textContent=`Resultado: ${pass} aprovado(s), ${fail} falha(s).`;summary.className='card '+(fail?'fail':'ok')}
document.getElementById('run').addEventListener('click',run);
</script></body></html>
