<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autoteste — Plataforma Clínica</title><style>body{font:16px/1.5 system-ui;margin:0;background:#f4f8fa;color:#20343d}.shell{max-width:1050px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #c9dde4;border-radius:16px;padding:18px;margin:12px 0}.ok{color:#247c68}.fail{color:#9f2f40}.warn{color:#72520d}button{padding:10px 14px;border:0;border-radius:10px;background:#3f98b6;color:#fff;font-weight:700}.meta{font-size:13px;color:#526b75}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.summary{font-size:20px;font-weight:700}</style></head><body><main class="shell"><h1>Autoteste não destrutivo — v2.4.2</h1><p>Valida criptografia, sincronização event-driven, Google Workspace, Gemini incremental, saneamento de conflito legado do Meet e deduplicação do indicador de Agenda.</p><button id="run">Executar testes</button><div id="summary" class="card summary">Aguardando execução.</div><div id="results" class="grid"></div></main><script type="module">
import {deriveKey,randomBytes,encryptJson,decryptJson,sha256} from '../assets/js/crypto.js?v=2.4.2';
import {STORE_NAMES,SCHEMA_VERSION,APP_VERSION} from '../assets/js/state.js?v=2.4.2';
const out=document.getElementById('results'),summary=document.getElementById('summary');let pass=0,fail=0,warn=0;
function line(name,status,details=''){if(status==='ok')pass++;else if(status==='fail')fail++;else warn++;const d=document.createElement('div');d.className='card';d.innerHTML=`<strong class="${status}">${status==='ok'?'APROVADO':status==='fail'?'FALHOU':'ATENÇÃO'}</strong> — ${name}${details?`<div class="meta">${details}</div>`:''}`;out.append(d)}
async function fetchOk(path){const r=await fetch(new URL(path,location.href),{cache:'no-store'});return{ok:r.ok,text:r.ok?await r.text():''}}
async function run(){out.innerHTML='';pass=0;fail=0;warn=0;try{
 line('Versão centralizada',APP_VERSION==='2.4.2'?'ok':'fail',APP_VERSION);line('Schema preservado',SCHEMA_VERSION===5?'ok':'fail');line('Stores clínicas preservadas',STORE_NAMES.includes('patients')&&STORE_NAMES.includes('appointments')&&STORE_NAMES.includes('records')?'ok':'fail');line('Web Crypto',crypto?.subtle?'ok':'fail');const key=await deriveKey('senha-teste',randomBytes(16),1000),payload=await encryptJson(key,{ok:true},'selftest'),plain=await decryptJson(key,payload,'selftest');line('AES-GCM',plain.ok?'ok':'fail');line('SHA-256',(await sha256('abc')).length===64?'ok':'fail');
 const files=['main-v240.js','secure-sync-v240.js','google-calendar-service-v240.js','clinical-reconcile-v240.js','gemini-reclassify-v241.js','legacy-sync-cleanup-v242.js','top-status-dedupe-v242.js'];for(const f of files){const r=await fetchOk(`../assets/js/${f}?v=2.4.2`);line(`Arquivo ${f}`,r.ok?'ok':'fail')}
 const index=await fetchOk('../index.html?v=2.4.2');line('Entrypoint único',index.ok&&index.text.includes('main-v240.js?v=2.4.2')?'ok':'fail');
 const main=await fetchOk('../assets/js/main-v240.js?v=2.4.2');line('Main carrega hotfix móvel',main.text.includes('legacy-sync-cleanup-v242.js')&&main.text.includes('top-status-dedupe-v242.js')?'ok':'fail');line('Cache v2.4.2',main.text.includes('?v=2.4.2')?'ok':'fail');
 const legacy=await fetchOk('../assets/js/legacy-sync-cleanup-v242.js?v=2.4.2');line('Saneamento restrito a estado técnico legado',legacy.text.includes('sync_state_v18')&&legacy.text.includes("deleteRecord('settings'")&&legacy.text.includes('BASELINE_STORAGE')?'ok':'fail');line('Saneamento dispara nova sincronização',legacy.text.includes('performSync({manual:true})')?'ok':'fail');
 const dedupe=await fetchOk('../assets/js/top-status-dedupe-v242.js?v=2.4.2');line('Agenda mantém proprietário único',dedupe.text.includes('rm-calendar-status-v240')&&dedupe.text.includes('MutationObserver')?'ok':'fail');
 const gemini=await fetchOk('../assets/js/clinical-reconcile-v240.js?v=2.4.2');line('Conflito pausa Gemini',gemini.text.includes("syncState==='conflict'")?'ok':'fail');
}catch(e){line('Execução geral','fail',e.message)}summary.textContent=`Resultado: ${pass} aprovado(s), ${fail} falha(s), ${warn} atenção(ões).`;summary.className='card summary '+(fail?'fail':'ok')}
document.getElementById('run').addEventListener('click',run);
</script></body></html>
